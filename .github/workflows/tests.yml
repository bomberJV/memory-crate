name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the workload in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/workload-checks" --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/workload-checks/node_modules" node scripts/check-workload.cjs "$RUNNER_TEMP/workload-pictures"
      - name: Save screen checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workload-preview
          path: ${{ runner.temp }}/workload-pictures
          if-no-files-found: ignore
          retention-days: 7

