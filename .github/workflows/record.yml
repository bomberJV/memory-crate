name: Record inference
on:
  pull_request:
    paths:
      - 'experiment/record.py'
      - 'experiment/requirements.txt'
      - '.github/workflows/record.yml'
    types: [opened, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r experiment/requirements.txt
      - run: python experiment/record.py recorded-run.json --print-archive
      - uses: actions/upload-artifact@v4
        with:
          name: inference-record
          path: recorded-run.json
